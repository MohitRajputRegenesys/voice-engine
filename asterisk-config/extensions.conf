; =============================================================================
; Asterisk dialplan for the 3CX AI-agent integration.
;
; Inbound : 3CX -> extension 900 -> INVITE to Asterisk -> [from-3cx]
;           -> Stasis(voice-engine,inbound) -> the AI answers.
; Outbound: driven by the voice-engine over ARI (POST /api/threecx/calls/outbound)
;           which dials PJSIP/3cx/<digits> directly -- no dialplan entry needed.
; Milestone 3 (two-way audio, no AI): originate to the echo test from a shell:
;
;   curl --digest -u voice-engine:ARI_PASSWORD \
;     -X POST "http://127.0.0.1:8088/ari/channels" \
;     -d "endpoint=PJSIP/3cx/YOUR_MOBILE" \
;     -d "context=milestone-3-test" -d "extension=600" -d "priority=1" \
;     -d "timeout=30"
; =============================================================================

[general]
static=yes
writeprotect=yes

[from-3cx]
; Inbound call from 3CX (customer -> Airtel -> 3CX -> ext 900 -> Asterisk).
; Send the call into the voice-engine Stasis application; the engine answers,
; bridges external media and starts STT -> RAG -> TTS.
exten => _[0-9+].,1,NoOp(Inbound AI call from 3CX, CID=${CALLERID(num)})
 same => n,Stasis(voice-engine,inbound)
 same => n,Hangup()

; Some 3CX builds send an empty/unknown extension for trunk-to-extension calls.
exten => s,1,NoOp(Inbound AI call (s) from 3CX, CID=${CALLERID(num)})
 same => n,Stasis(voice-engine,inbound)
 same => n,Hangup()

[milestone-3-test]
; Two-way audio verification without any AI involvement:
; Asterisk -> 3CX -> Airtel -> your mobile, then everything you say is echoed.
exten => 600,1,NoOp(Echo test over 3CX/Airtel)
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()
