; =============================================================================
; ARI user for the voice-engine. Copy the password into ARI_PASSWORD in the
; voice-engine .env (ARI_USERNAME must match the section name below).
; =============================================================================
[general]
enabled=yes
pretty=yes

[voice-engine]
type=user
read_only=no
password=CHANGE_ME_STRONG_PASSWORD
; password_format=plain   ; default; use crypt/md5 if you prefer hashed values
