[general]
static=yes
writeprotect=yes

[from-3cx]
exten => _X.,1,NoOp(Inbound AI call from 3CX: ${EXTEN} CID=${CALLERID(num)})
 same => n,Stasis(voice-engine,inbound)
 same => n,Hangup()
exten => s,1,NoOp(Inbound AI call from 3CX (s): CID=${CALLERID(num)})
 same => n,Stasis(voice-engine,inbound)
 same => n,Hangup()

[from-3cx-echo]
exten => _X.,1,Answer()
 same => n,Echo()
 same => n,Hangup()

[from-3cx-dialout]
exten => _X.,1,NoOp(Manual outbound test call to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@3cx,60)
 same => n,Hangup()

[milestone-3-test]
exten => 600,1,NoOp(Echo test over 3CX/Airtel)
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()
