; =============================================================================
; Asterisk built-in HTTP server: hosts the ARI REST + WebSocket interface that
; the voice-engine talks to (ARI_BASE_URL). Keep this on the LAN/VPN only.
; =============================================================================
[general]
enabled=yes
enablepretty=yes
bindaddr=0.0.0.0
bindport=8088
; If the voice-engine runs on a different host, restrict further with your
; firewall; ARI credentials are enforced per-user in ari.conf.
